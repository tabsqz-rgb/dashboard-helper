name: Content Rewards login test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  login-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright
      - run: playwright install --with-deps chromium
      - run: python helper/login_test.py
        env:
          CR_STATE: ${{ secrets.CR_STATE }}
          TEST_CAMPAIGN: 6a478a78-d3fe-4e07-80fc-4bde2fd215aa
